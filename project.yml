# project.yml — XcodeGen cho Respring 27.
# Sinh file .xcodeproj bằng:  xcodegen generate
# (cài XcodeGen: brew install xcodegen)
name: Respring27
options:
  bundleIdPrefix: com.harry
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "4"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    # Team để trống: IPA build ra sẽ KHÔNG ký (unsigned), user tự ký
    # bằng Feather với chứng chỉ Developer của mình. Nếu build trên Mac
    # để chạy trực tiếp thì điền Team ID của mình vào đây.

targets:
  Respring27:
    type: application
    platform: iOS
    sources:
      - path: Respring
    settings:
      base:
        PRODUCT_NAME: "Respring27"
        PRODUCT_BUNDLE_IDENTIFIER: com.harry.respring2721
        INFOPLIST_FILE: Respring/Info.plist
        CODE_SIGN_ENTITLEMENTS: Respring/Respring27.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO

schemes:
  Respring27:
    build:
      targets:
        Respring27: all
    run:
      config: Release
    archive:
      config: Release
